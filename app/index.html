<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" />
  <title>飞牛音乐 · 桌面播放器</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 18V6l10-2v12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="16" r="2.5" stroke="currentColor" stroke-width="1.8"/></svg>
      </div>
      <div class="brand-text">
        <strong>飞牛音乐</strong>
        <span>Desktop Player</span>
      </div>
    </div>

    <nav class="nav" id="nav">
      <a href="#/home" data-nav="home"><i class="ico">⌂</i><span>首页</span></a>
      <a href="#/tracks" data-nav="tracks"><i class="ico">♪</i><span>歌曲</span></a>
      <a href="#/albums" data-nav="albums"><i class="ico">▤</i><span>专辑</span></a>
      <a href="#/artists" data-nav="artists"><i class="ico">☺</i><span>歌手</span></a>
      <a href="#/playlists" data-nav="playlists"><i class="ico">≡</i><span>歌单</span></a>
      <a href="#/favorites" data-nav="favorites"><i class="ico">♥</i><span>我的收藏</span></a>
      <a href="#/folders" data-nav="folders"><i class="ico">▢</i><span>文件夹</span></a>
      <a href="#/search" data-nav="search"><i class="ico">⌕</i><span>搜索</span></a>
    </nav>

    <div class="sidebar-foot">
      <div class="server-card" id="serverCard">
        <div class="server-dot" id="serverDot"></div>
        <div class="server-meta">
          <strong id="serverName">未连接</strong>
          <span id="serverHost">点击设置服务器</span>
        </div>
      </div>
      <div class="user-row" id="userRow">
        <div class="avatar" id="userAvatar">?</div>
        <div class="user-meta">
          <strong id="userName">未登录</strong>
          <span id="userRole">飞牛账号</span>
        </div>
        <button class="icon-btn" id="logoutBtn" title="退出登录">⎋</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="route-title" id="routeTitle">首页</div>
      <div class="search-box">
        <span>⌕</span>
        <input id="globalSearch" type="search" placeholder="搜索歌曲、专辑、歌手…" autocomplete="off" />
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="refreshBtn" title="刷新">⟳</button>
      </div>
    </header>
    <section class="view" id="view"></section>
  </main>

  <footer class="playerbar" id="playerbar">
    <div class="now-playing">
      <div class="np-cover" id="npCover"></div>
      <div class="np-meta">
        <div class="np-title" id="npTitle">未在播放</div>
        <div class="np-artist" id="npArtist">选择一首歌开始</div>
      </div>
      <button class="icon-btn fav-btn" id="npFav" title="收藏">♡</button>
    </div>

    <div class="player-center">
      <div class="controls">
        <button class="icon-btn" id="shuffleBtn" title="随机播放">⇄</button>
        <button class="icon-btn" id="prevBtn" title="上一首">⏮</button>
        <button class="play-btn" id="playBtn" title="播放">
          <svg id="playIcon" viewBox="0 0 24 24" width="22" height="22"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" id="nextBtn" title="下一首">⏭</button>
        <button class="icon-btn" id="repeatBtn" title="循环模式">↻</button>
      </div>
      <div class="progress-row">
        <span id="curTime">0:00</span>
        <div class="progress" id="progress"><div class="progress-fill" id="progressFill"></div><div class="progress-thumb" id="progressThumb"></div></div>
        <span id="durTime">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <button class="icon-btn" id="lyricsBtn" title="歌词">词</button>
      <button class="icon-btn" id="queueBtn" title="播放队列">☰</button>
      <div class="volume-wrap">
        <button class="icon-btn" id="muteBtn" title="静音">🔊</button>
        <div class="volume" id="volume"><div class="volume-fill" id="volumeFill"></div></div>
      </div>
    </div>
  </footer>

  <aside class="drawer" id="queueDrawer">
    <div class="drawer-head"><strong>播放队列</strong><button class="icon-btn" data-close-drawer>✕</button></div>
    <div class="drawer-body" id="queueList"></div>
  </aside>

  <aside class="drawer" id="lyricsDrawer">
    <div class="drawer-head"><strong>歌词</strong><button class="icon-btn" data-close-drawer>✕</button></div>
    <div class="drawer-body lyrics" id="lyricsBody"><div class="lyrics-empty">暂无歌词</div></div>
  </aside>

  <div class="modal-mask" id="serverModal">
    <div class="modal">
      <h2>连接飞牛 NAS</h2>
      <p class="modal-sub">填写飞牛 NAS 地址，通过飞牛账号授权登录。</p>
      <label>服务器地址</label>
      <input id="hostInput" placeholder="http://192.168.1.10:5000" />
      <div class="modal-actions">
        <button class="btn ghost" data-close-modal>取消</button>
        <button class="btn" id="connectBtn">连接并登录</button>
      </div>
      <details class="manual">
        <summary>已有 music-token？手动粘贴</summary>
        <input id="tokenInput" placeholder="32 位 token" />
        <button class="btn ghost" id="tokenBtn">使用 Token 登录</button>
      </details>
      <div class="modal-msg" id="modalMsg"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <audio id="audio" preload="metadata"></audio>
</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
